<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="50%" stop-color="#0369a1" />
            <stop offset="100%" stop-color="#0f766e" />
        </linearGradient>
        <linearGradient id="fishGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="40%" stop-color="#bae6fd" />
            <stop offset="100%" stop-color="#38bdf8" />
        </linearGradient>
        <linearGradient id="fishGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#a7f3d0" />
            <stop offset="60%" stop-color="#34d399" />
            <stop offset="100%" stop-color="#ffffff" />
        </linearGradient>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0369a1" flood-opacity="0.35" />
        </filter>
    </defs>

    <!-- Outer Decorative Ring -->
    <circle cx="64" cy="64" r="60" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="8 4" opacity="0.75" />

    <!-- Main Badge Background -->
    <circle cx="64" cy="64" r="54" fill="url(#bgGrad)" filter="url(#shadow)" />

    <!-- Inner Subtle Glow Ring -->
    <circle cx="64" cy="64" r="50" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25" />

    <!-- Water Waves / Ripple arcs -->
    <path d="M 28 66 C 40 74, 52 58, 64 66 C 76 74, 88 58, 100 66" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.3" />
    <path d="M 32 74 C 44 80, 54 68, 64 74 C 74 80, 84 68, 96 74" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.25" />

    <!-- Leaping Fish 1 (Top / Right arc - Sana Marine Blue) -->
    <g id="fish-top" filter="url(#glow)">
        <!-- Main Body -->
        <path d="M 34 50 C 44 32, 70 28, 86 38 C 93 42, 97 49, 90 52 C 82 55, 68 50, 52 54 C 43 56, 37 54, 34 50 Z" 
              fill="url(#fishGrad1)" />
        <!-- Tail Fin -->
        <path d="M 35 50 C 26 44, 20 40, 16 46 C 22 51, 25 51, 22 58 C 28 55, 33 53, 35 50 Z" 
              fill="url(#fishGrad1)" />
        <!-- Dorsal Fin -->
        <path d="M 60 32 C 68 25, 76 27, 80 32 C 73 34, 66 34, 60 32 Z" 
              fill="#ffffff" opacity="0.8" />
        <!-- Eye -->
        <circle cx="85" cy="43" r="2.5" fill="#0f172a" />
        <circle cx="86" cy="42" r="0.8" fill="#ffffff" />
    </g>

    <!-- Swimming Bagda / Fish 2 (Bottom / Left arc - Emerald Teal) -->
    <g id="fish-bottom" filter="url(#glow)">
        <!-- Body -->
        <path d="M 94 78 C 84 96, 58 100, 42 90 C 35 86, 31 79, 38 76 C 46 73, 60 78, 76 74 C 85 72, 91 74, 94 78 Z" 
              fill="url(#fishGrad2)" />
        <!-- Tail -->
        <path d="M 93 78 C 102 84, 108 88, 112 82 C 106 77, 103 77, 106 70 C 100 73, 95 75, 93 78 Z" 
              fill="url(#fishGrad2)" />
        <!-- Fin -->
        <path d="M 68 96 C 60 103, 52 101, 48 96 C 55 94, 62 94, 68 96 Z" 
              fill="#ffffff" opacity="0.8" />
        <!-- Eye -->
        <circle cx="43" cy="85" r="2.5" fill="#0f172a" />
        <circle cx="42" cy="84" r="0.8" fill="#ffffff" />
    </g>

    <!-- Center Energy Sparks / Water Droplets -->
    <circle cx="64" cy="48" r="2.2" fill="#ffffff" opacity="0.9" />
    <circle cx="56" cy="62" r="1.8" fill="#bae6fd" opacity="0.8" />
    <circle cx="72" cy="66" r="1.8" fill="#a7f3d0" opacity="0.8" />
    <circle cx="64" cy="80" r="1.5" fill="#ffffff" opacity="0.7" />
</svg>